[project]
name = "amrutam-telemedicine"
version = "0.1.0"
description = "Amrutam Telemedicine backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "alembic>=1.13.0,<2.0.0",
  "pydantic[email]>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "redis>=5.0.0,<6.0.0",
  "celery[redis]>=5.4.0,<6.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "argon2-cffi>=23.1.0,<25.0.0",
  "pyotp>=2.9.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "opentelemetry-api>=1.27.0,<2.0.0",
  "opentelemetry-sdk>=1.27.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1.0.0",
  "opentelemetry-instrumentation-redis>=0.48b0,<1.0.0",
  "structlog>=24.4.0,<25.0.0",
  "gunicorn>=22.0.0,<24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0",
  "bandit[toml]>=1.7.0,<2.0.0",
  "pip-audit>=2.7.0,<3.0.0",
]

[tool.ruff]
line-length = 100
indent-width = 4
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"
markers = [
  "unit: fast isolated tests",
  "integration: application and persistence integration tests",
  "security: authentication, authorization, and data-safety tests",
  "concurrency: concurrent request and worker behavior tests",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
